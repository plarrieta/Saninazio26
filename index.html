<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#0b0b0d"><title>LETRAK · Buscador multifuente</title><style>:root{--bg:#0b0b0d;--panel:#17171b;--panel2:#222228;--text:#fff;--muted:#b8b8c2;--accent:#ffd84d;--line:#3a3a43}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}header{padding:26px 18px 22px;background:#121216;border-bottom:1px solid var(--line)}.wrap{max-width:820px;margin:auto}h1{margin:0;font-size:40px}.tagline{margin-top:6px;color:var(--muted);font-size:17px}main{padding:22px 16px 40px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}label{display:block;font-size:17px;font-weight:800;margin-bottom:9px}input{width:100%;padding:18px 16px;border-radius:14px;border:1px solid #64646e;background:#28282e;color:#fff;font-size:21px}input:focus,button:focus{outline:4px solid var(--accent);outline-offset:2px}button{border:0;border-radius:14px;padding:16px 14px;font-size:18px;font-weight:850;cursor:pointer;min-height:56px}.primary{width:100%;margin-top:12px;background:var(--accent);color:#111}.hint{margin:13px 2px 0;color:var(--muted);line-height:1.45}.section-title{margin:24px 2px 12px;font-size:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.source{background:var(--panel2);color:#fff;border:1px solid #4b4b56;text-align:left;display:flex;align-items:center;gap:11px}.source span{font-size:25px}.source small{display:block;color:#bdbdc7;font-weight:normal;margin-top:3px;font-size:13px}.full{grid-column:1/-1}.status{margin-top:18px;padding:14px 15px;border-radius:13px;background:#202027;border:1px solid var(--line);color:#ddd;display:none}.history{display:grid;gap:9px}.history-row{display:flex;gap:8px}.history-row button:first-child{flex:1;text-align:left;background:#202027;color:#fff;border:1px solid var(--line);min-height:48px;padding:12px 14px;font-size:16px}.history-row .x{width:48px;background:#202027;color:#bbb;border:1px solid var(--line);min-height:48px;padding:8px}.footer{text-align:center;color:#777;margin-top:28px;font-size:13px}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:35px}}</style></head><body><header><div class="wrap"><h1>🎵 LETRAK</h1><div class="tagline">Busca una canción en varias fuentes originales</div></div></header><main class="wrap"><section class="card"><label for="q">Título y, si lo sabes, cantante</label><input id="q" placeholder="Ej.: Imagine John Lennon" autocomplete="off" autofocus><button id="all" class="primary">🔎 Buscar en Internet</button><div class="hint">Primero prueba el botón amarillo. Debajo puedes buscar directamente en una fuente concreta.</div><div id="status" class="status"></div></section><h2 class="section-title">Fuentes</h2><section class="grid"><button class="source" data-source="genius"><span>🧠</span><div>Genius<small>Amplio catálogo internacional</small></div></button><button class="source" data-source="musixmatch"><span>🎼</span><div>Musixmatch<small>Muchas canciones e idiomas</small></div></button><button class="source" data-source="letras"><span>🌎</span><div>Letras.com<small>Especialmente útil en castellano</small></div></button><button class="source" data-source="azlyrics"><span>🔤</span><div>AZLyrics<small>Catálogo amplio en inglés</small></div></button><button class="source" data-source="kantari"><span>🔴</span><div>Kantari<small>Canciones en euskera</small></div></button><button class="source" data-source="youtube"><span>▶️</span><div>YouTube karaoke<small>Vídeos con letra</small></div></button><button class="source full" data-source="google"><span>🌐</span><div>Búsqueda general<small>Busca la letra en cualquier página disponible</small></div></button></section><h2 class="section-title">Últimas búsquedas</h2><section id="history" class="history"></section><div class="footer">SANINAZIO26 · LETRAK multifuente</div></main><script>const q=document.getElementById('q'),statusBox=document.getElementById('status'),historyBox=document.getElementById('history'),KEY='letrak_multisource_history';const searches={google:t=>`${t} letra lyrics`,genius:t=>`site:genius.com ${t} lyrics`,musixmatch:t=>`site:musixmatch.com ${t} lyrics`,letras:t=>`site:letras.com ${t} letra`,azlyrics:t=>`site:azlyrics.com ${t} lyrics`,kantari:t=>`site:kantari.eus ${t}`,youtube:t=>`site:youtube.com ${t} karaoke letra`};function loadHistory(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function saveHistory(t){let l=loadHistory().filter(x=>x.toLowerCase()!==t.toLowerCase());l.unshift(t);localStorage.setItem(KEY,JSON.stringify(l.slice(0,12)));renderHistory()}function removeHistory(t){localStorage.setItem(KEY,JSON.stringify(loadHistory().filter(x=>x!==t)));renderHistory()}function openSearch(s='google'){const t=q.value.trim();if(!t){statusBox.style.display='block';statusBox.textContent='Escribe primero el título de una canción.';q.focus();return}saveHistory(t);statusBox.style.display='block';statusBox.textContent='Abriendo resultados para: '+t;window.location.href='https://www.google.com/search?q='+encodeURIComponent(searches[s](t))}function renderHistory(){const l=loadHistory();historyBox.innerHTML='';if(!l.length){historyBox.innerHTML='<div style="color:#85858f">Todavía no hay búsquedas guardadas.</div>';return}l.forEach(t=>{const r=document.createElement('div');r.className='history-row';const o=document.createElement('button');o.textContent=t;o.onclick=()=>{q.value=t;openSearch('google')};const d=document.createElement('button');d.className='x';d.textContent='×';d.onclick=()=>removeHistory(t);r.append(o,d);historyBox.appendChild(r)})}document.getElementById('all').onclick=()=>openSearch('google');document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>openSearch(b.dataset.source));q.addEventListener('keydown',e=>{if(e.key==='Enter')openSearch('google')});renderHistory();</script></body></html>
